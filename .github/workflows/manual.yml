name: Build Android APK (Debug)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          python3-pip \
          openjdk-17-jdk \
          zip unzip git \
          autoconf automake libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5 \
          libffi-dev \
          libssl-dev

    - name: Install Buildozer & Cython
      run: |
        pip3 install --upgrade pip
        pip3 install --upgrade buildozer cython virtualenv

    - name: Show buildozer version
      run: |
        buildozer --version

    - name: Build APK (verbose)
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OptionSignalAPK
        path: bin/*.apk
